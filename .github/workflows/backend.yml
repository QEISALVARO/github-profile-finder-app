name: Backend CI

on:
  push:
    branches: [main, "feat/be-*"]
    paths:
      - "supabase/**"
      - "contracts/**"
      - "scripts/backend/**"
      - ".github/workflows/backend.yml"
      - "Makefile"
  pull_request:
    paths:
      - "supabase/**"
      - "contracts/**"
      - "scripts/backend/**"
      - ".github/workflows/backend.yml"
      - "Makefile"

jobs:
  backend-static:
    name: Static Checks (no Docker)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          # Dikunci agar deterministik (bukan v2.x mengambang).
          deno-version: v2.9.8

      - name: Secret Scan — no service role key in src/
        run: |
          echo "Memeriksa service_role key di direktori klien (src/)..."
          if grep -rn "service_role\|SUPABASE_SERVICE_ROLE_KEY\|GITHUB_API_TOKEN" src/ --include='*.ts' --include='*.tsx'; then
            echo "ERROR: Ditemukan referensi service_role/token di direktori klien!"
            exit 1
          fi
          echo "Direktori klien bersih dari service_role key."

      - name: Encoding check — no BOM, no stray Cyrillic
        run: |
          echo "Memeriksa BOM dan karakter Cyrillic nyasar..."
          BOM_FILES=$(grep -rlP '^\xEF\xBB\xBF' supabase contracts scripts Makefile 2>/dev/null || true)
          if [ -n "$BOM_FILES" ]; then
            echo "ERROR: berkas dengan BOM ditemukan:"
            echo "$BOM_FILES"
            exit 1
          fi
          if command -v rg >/dev/null 2>&1; then
            CYR_FILES=$(rg -l -P '\p{Cyrillic}' supabase contracts scripts --glob '*.ts' --glob '*.sql' --glob '!*.md' 2>/dev/null || true)
          else
            CYR_FILES=$(grep -rlP '\p{Cyrillic}' supabase contracts scripts --include='*.ts' --include='*.sql' 2>/dev/null || true)
          fi
          if [ -n "$CYR_FILES" ]; then
            echo "ERROR: karakter Cyrillic nyasar di kode backend:"
            echo "$CYR_FILES"
            exit 1
          fi
          echo "Encoding bersih: tanpa BOM, tanpa Cyrillic nyasar."

      - name: Deno check contracts
        run: |
          deno check --frozen --config contracts/deno.json contracts/src/*.ts

      - name: Deno check functions
        run: |
          # Workspace backend: supabase/deno.json + supabase/deno.lock
          # (tanpa dependensi Expo dari package.json root).
          deno check --frozen --config supabase/deno.json supabase/functions/analyze-developer/index.ts supabase/functions/delete-account/index.ts supabase/functions/refresh-stale/index.ts supabase/functions/_shared/ssrf/safe-fetch.ts supabase/functions/_shared/scoring/score.ts

      - name: Run Deno Contract & Function Tests
        run: |
          deno test --frozen --config contracts/deno.json --allow-read --allow-env contracts/tests/
          deno test --frozen --config supabase/deno.json --allow-read --allow-env supabase/functions/

  backend-db:
    name: Database & Contracts Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Diagnose Docker
        run: |
          docker info
          df -h / | tail -n 1

      - name: Start Supabase Local Stack
        timeout-minutes: 25
        run: |
          supabase start 2>&1 | tail -n 40

      - name: Run Database Migrations & Seeds from scratch
        run: |
          supabase db reset --debug 2>&1 | tail -n 60

      - name: Run pgTAP Database Tests (RLS, POL-9, RPCs)
        run: |
          supabase test db --debug 2>&1 | tee /tmp/pgtap.log | tail -n 80
          echo '### pgTAP tail' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 60 /tmp/pgtap.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Check Database Types Drift
        run: |
          supabase gen types typescript --local --schema public -o generated.types.ts
          test -s generated.types.ts
          grep -vE '^\s*(//|$)' contracts/src/database.types.ts | tr -d '[:space:]' > /tmp/committed.norm
          grep -vE '^\s*(//|$)' generated.types.ts | tr -d '[:space:]' > /tmp/generated.norm
          diff -q /tmp/committed.norm /tmp/generated.norm && echo "Types selaras (semantik)."
          rm -f generated.types.ts

      - name: Lint Database
        run: |
          supabase db lint
