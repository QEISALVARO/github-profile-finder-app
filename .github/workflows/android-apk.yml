name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK (EAS)
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Check EAS environment for preview
        continue-on-error: true
        run: |
          eas env:list --environment preview \
            | sed -n 's/^\([A-Z0-9_]*\)=.*/\1/p' \
            | sort > eas-env-names.txt
          echo "EAS env (preview):"
          cat eas-env-names.txt
          missing=0
          for name in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_DS_AUTH; do
            if ! grep -qx "$name" eas-env-names.txt; then
              echo "::warning title=EAS env::$name belum diset untuk environment preview"
              missing=1
            fi
          done
          if ! grep -qxE 'EXPO_PUBLIC_SUPABASE_(ANON_KEY|PUBLISHABLE_KEY)' eas-env-names.txt; then
            echo "::warning title=EAS env::EXPO_PUBLIC_SUPABASE_ANON_KEY / PUBLISHABLE_KEY belum diset"
            missing=1
          fi
          if [ "$missing" = "1" ]; then
            echo "Tanpa env di atas, APK memakai sesi demo lokal — lihat docs/auth-github-oauth.md."
          fi

      - name: Build Android APK (preview)
        run: eas build --platform android --profile preview --non-interactive

      - name: Get latest Android build
        id: latest_build
        run: |
          BUILD_JSON=$(eas build:list --platform android --limit 10 --json)
          BUILD_ID=$(echo "$BUILD_JSON" | jq -r '.[0].id')
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Download APK
        id: download
        run: |
          eas build:download --build-id ${{ steps.latest_build.outputs.build_id }} --json > eas-download.json
          APK_PATH=$(jq -r '.path' eas-download.json)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Stage APK as gitscope-1.0.0.apk
        run: |
          APK_PATH="${{ steps.download.outputs.apk_path }}"
          cp "$APK_PATH" ./gitscope-1.0.0.apk
          chmod 755 ./gitscope-1.0.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: gitscope-android-apk
          path: ./gitscope-1.0.0.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.0
          name: gitscope v1.0.0
          files: ./gitscope-1.0.0.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
