name: OTA Update

# Kirim perbaikan JS/asset tanpa build APK baru. Jalankan manual dari tab
# Actions → "OTA Update" → Run workflow. Lihat README §Update OTA.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel EAS Update yang dituju (harus sama dengan channel APK terpasang)
        type: choice
        options: [preview, production]
        default: preview
      message:
        description: Pesan update (muncul di dashboard EAS)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish OTA
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      UPDATE_CHANNEL: ${{ inputs.channel }}
      UPDATE_MESSAGE: ${{ inputs.message }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Publish update
        run: |
          eas update \
            --channel "$UPDATE_CHANNEL" \
            --environment "$UPDATE_CHANNEL" \
            --message "$UPDATE_MESSAGE" \
            --non-interactive
