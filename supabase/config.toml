# supabase/config.toml
# Supabase CLI v2.122.0 — local dev config

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[realtime]
enabled = true
ip_version = "IPv6"
max_header_length = 4096

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# Gunakan URL custom scheme untuk Expo app
site_url = "gitscope://auth/callback"
additional_redirect_urls = [
  "gitscope://auth/callback",
  # Tautan reset password memakai route khusus agar app tahu konteks recovery.
  "gitscope://auth/update-password",
  "exp://localhost:8081",
  "exp://127.0.0.1:8081",
  # Web / Expo web: emailRedirectUrl() memakai window.location.origin.
  "http://localhost:8081",
  "http://127.0.0.1:8081",
  "http://localhost:8081/auth/callback",
  "http://127.0.0.1:8081/auth/callback",
  "http://localhost:8081/auth/update-password",
  "http://127.0.0.1:8081/auth/update-password",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
# P0 — email/password untuk recruiter. POL-2 tetap berlaku: alamat email tidak
# pernah masuk kolom publik profiles, hanya di auth.users + sesi lokal klien.
enable_email_signup = true
enable_email_autoconfirm = false
minimum_password_length = 8
password_requirements = ""
# Akun Google boleh menautkan GitHub lewat linkIdentity() (manual linking).
enable_manual_linking = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Konfirmasi email aktif (konsisten dengan default project hosted): layar
# register menampilkan state "cek inbox" + tombol kirim ulang konfirmasi.
enable_confirmations = true

[auth.sms]
enable_signup = false

# GitHub OAuth — scope minimal read:user (tanpa email, POL-2)
[auth.external.github]
enabled = true
client_id = "env(GITHUB_CLIENT_ID)"
secret = "env(GITHUB_CLIENT_SECRET)"
redirect_uri = ""

# Google OAuth — login alternatif; penautan GitHub kini opsional (hanya wajib
# untuk fitur developer yang butuh identitas GitHub, lihat migrasi 023).
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = ""
skip_nonce_check = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false

[experimental]
orioledb_version = ""
s3_host = "env(S3_HOST)"
s3_region = "env(S3_REGION)"
s3_access_key = "env(S3_ACCESS_KEY)"
s3_secret_key = "env(S3_SECRET_KEY)"
